<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0877e8">
  <title>GCash Tracker</title>
  <style>
    html,body{
      margin:0;
      width:100%;
      height:100%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-family:Arial,sans-serif;
      background:#fff;
      color:#222;
    }
    .msg{padding:24px;text-align:center}
  </style>
</head>
<body>
  <div class="msg">Opening GCash Tracker…</div>

  <script>
  (function(){
    // Keep your exact Apps Script /exec URL here.
    const APP_URL = 'https://script.google.com/macros/s/AKfycbzHZBbsTHU5rRMrO4iNCizaQHd1SqVMb1NgWFSRvw8UHf_zdJTLJEQHYZTouUfvpknouw/exec';
    const DEVICE_KEY = 'gcashTrustedDevice';

    const params = new URLSearchParams(location.search);
    const incomingDevice = params.get('device') || '';
    const handoff = params.get('handoff') || '';

    if(incomingDevice){
      try{ localStorage.setItem(DEVICE_KEY, incomingDevice); }catch(e){}
    }

    let device = incomingDevice;
    if(!device){
      try{ device = localStorage.getItem(DEVICE_KEY) || ''; }catch(e){}
    }

    const target = new URL(APP_URL);

    if(device) target.searchParams.set('device', device);
    if(handoff) target.searchParams.set('handoff', handoff);

    // Important: use full-page navigation, not an iframe.
    location.replace(target.toString());
  })();
  </script>
</body>
</html>
