<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0877e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GCash Tracker">
  <title>GCash Tracker</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(420px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 8px;font-size:26px}
    p{margin:0 0 18px;line-height:1.45;color:#667085}
    button{width:100%;border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700;background:#0877e8;color:#fff;cursor:pointer}
    .small{font-size:13px;margin-top:14px;color:#8a94a6}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>GCash Tracker</h1>
      <p id="message">Open your tracker or add this page to your Home Screen.</p>
      <button id="openBtn" type="button">Open GCash Tracker</button>
      <div class="small" id="installNote">Pair this page once, then add it to your Home Screen.</div>
    </div>
  </div>

<script>
(function(){
  // Replace with your exact Apps Script /exec URL.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzHZBbsTHU5rRMrO4iNCizaQHd1SqVMb1NgWFSRvw8UHf_zdJTLJEQHYZTouUfvpknouw/exec';
  const DEVICE_KEY = 'gcashTrustedDevice';

  const query = new URLSearchParams(location.search);
  const hash = new URLSearchParams(location.hash.replace(/^#/, ''));

  // A device token can arrive from the Apps Script Google callback in ?device=
  // or be permanently carried by the Home Screen launch URL in #device=.
  const queryDevice = query.get('device') || '';
  const pairDevice = query.get('pair') || '';
  const hashDevice = hash.get('device') || '';
  const device = pairDevice || queryDevice || hashDevice || '';

  const handoff = query.get('handoff') || '';

  if(device){
    try{ localStorage.setItem(DEVICE_KEY, device); }catch(e){}
  }

  // Convert either a normal callback ?device=TOKEN or a one-time
  // Home Screen pairing link ?pair=TOKEN into a permanent #device=TOKEN
  // launch address before the page is added to the Home Screen.
  if(pairDevice || queryDevice){
    const permanentHomeUrl =
      location.pathname +
      '#device=' + encodeURIComponent(pairDevice || queryDevice);

    history.replaceState(null, '', permanentHomeUrl);
  }

  function getDevice(){
    const currentHash = new URLSearchParams(location.hash.replace(/^#/, ''));
    const fromHash = currentHash.get('device') || '';
    if(fromHash) return fromHash;

    try{ return localStorage.getItem(DEVICE_KEY) || ''; }
    catch(e){ return ''; }
  }

  function openTracker(){
    const trustedDevice = getDevice();
    const target = new URL(APP_URL);

    if(trustedDevice){
      target.searchParams.set('device', trustedDevice);
    }

    // Only use the short-lived handoff on the immediate callback launch.
    if(handoff){
      target.searchParams.set('handoff', handoff);
    }

    location.href = target.toString();
  }

  document.getElementById('openBtn').addEventListener('click', openTracker);

  const standalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if(getDevice()){
    document.getElementById('installNote').textContent =
      'Trusted sign-in is ready. Add this exact page to your Home Screen.';
  }

  // Installed Home Screen app:
  // read the trusted device from its own saved #device= launch URL,
  // then open Apps Script automatically.
  if(standalone){
    document.getElementById('message').textContent = 'Opening your GCash Tracker…';
    setTimeout(openTracker, 150);
  }
})();
</script>
</body>
</html>
