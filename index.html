<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0877e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="GCash Tracker">
  <title>GCash Tracker</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;background:#f5f7fb;color:#172033}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:min(420px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 10px 35px rgba(0,0,0,.08);text-align:center}
    h1{margin:0 0 8px;font-size:26px}
    p{margin:0 0 18px;line-height:1.45;color:#667085}
    button{width:100%;border:0;border-radius:12px;padding:15px 18px;font-size:16px;font-weight:700;background:#0877e8;color:#fff;cursor:pointer}
    .small{font-size:13px;margin-top:14px;color:#8a94a6}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>GCash Tracker</h1>
      <p id="message">Open your tracker or add this page to your Home Screen.</p>
      <button id="openBtn" type="button">Open GCash Tracker</button>
      <div class="small">For Home Screen: add this page before tapping Open GCash Tracker.</div>
    </div>
  </div>

<script>
(function(){
  // Replace this placeholder with your exact Apps Script WEB_APP_URL ending in /exec.
  const APP_URL = 'https://script.google.com/macros/s/AKfycbzHZBbsTHU5rRMrO4iNCizaQHd1SqVMb1NgWFSRvw8UHf_zdJTLJEQHYZTouUfvpknouw/exec';
  const DEVICE_KEY = 'gcashTrustedDevice';

  const params = new URLSearchParams(location.search);
  const incomingDevice = params.get('device') || '';
  const handoff = params.get('handoff') || '';

  if(incomingDevice){
    try{ localStorage.setItem(DEVICE_KEY,incomingDevice); }catch(e){}
  }

  // Clean private callback parameters from the visible GitHub URL after saving.
  if(params.has('device') || params.has('handoff')){
    history.replaceState(null,'',location.pathname);
  }

  function getDevice(){
    try{ return localStorage.getItem(DEVICE_KEY) || ''; }catch(e){ return ''; }
  }

  function openTracker(){
    const target = new URL(APP_URL);
    const device = getDevice();
    if(device) target.searchParams.set('device',device);
    if(handoff) target.searchParams.set('handoff',handoff);
    location.href = target.toString();
  }

  document.getElementById('openBtn').addEventListener('click',openTracker);

  // When launched as an installed Home Screen web app, open automatically.
  // The GitHub URL itself remains the saved Home Screen start page.
  const standalone =
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if(standalone){
    document.getElementById('message').textContent='Opening your GCash Tracker…';
    setTimeout(openTracker,150);
  }
})();
</script>
</body>
</html>
